apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-v3

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flask-v3

  template:
    metadata:
      labels:
        app: flask-v3

    spec:
      containers:
        - name: flask-v3

          # CHANGE: Replace YOUR_DOCKERHUB_USERNAME
          image: YOUR_DOCKERHUB_USERNAME/flask-lab-app:v3

          ports:
            - containerPort: 5000
